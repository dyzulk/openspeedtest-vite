# Nginx server configuration adapted for OpenSpeedTest Vite

server {
    server_name _ localhost;
    listen 3000 reuseport;
    listen [::]:3000 reuseport;
    
    listen 3001 ssl reuseport;
    listen [::]:3001 ssl reuseport;

    # SSL configuration (Self-signed fallback or custom certs)
    ssl_certificate /etc/ssl/nginx.crt;
    ssl_certificate_key /etc/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:100m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    root /usr/share/nginx/html;
    index index.html;
    
    # Allow large uploads for speed testing (e.g. up to 35m)
    client_max_body_size 35m;
    
    # Intercept POST to static files (like /upload) and return 200 OK
    error_page 405 =200 $uri;
    
    access_log off;
    gzip off;
    log_not_found off;
    server_tokens off;
    error_log /dev/null; # Suppress logging to optimize performance
    
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;

    # Root location (matches index.html and test endpoints)
    location / {
        add_header 'Access-Control-Allow-Origin' "*" always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        
        # Prevent browser/proxy caching for the index file and test files (downloading/upload)
        add_header Cache-Control 'no-store, no-cache, max-age=0, must-revalidate, no-transform' always;
        add_header Last-Modified $date_gmt;
        if_modified_since off;
        expires off;
        etag off;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Credentials' "true";
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' "GET, POST, OPTIONS" always;
            return 200;
        }
    }

    # Static Assets Caching (Vite compiled hashed files like JS/CSS/Fonts)
    location ~* ^.+\.(?:css|js|woff2?|svg|png|jpe?g|gif|ico|xml|webmanifest)$ {
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        tcp_nodelay off;
        
        # Optimize file descriptor cache
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
        
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    }
}
